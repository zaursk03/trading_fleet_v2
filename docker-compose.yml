name: trading-fleet

# ═══════════════════════════════════════════════════════════════
#  Due magazzini: bundle ricerca (git-tracked nel fork) vs cache live (ftcache).
#  Runtime IPC = ./shared/run → /ftcache. Dev = runner (MAI live); live = servizi separati, DB vergine.
#  Ricerca versionata = shared/local/sviluppo; runtime dev ignorato = dev/user_data.
# ═══════════════════════════════════════════════════════════════

x-defaults: &defaults
  restart: unless-stopped
  stop_grace_period: 60s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  healthcheck:
    test: ["CMD", "curl", "-f", "-s", "-o", "/dev/null", "http://127.0.0.1:8080/api/v1/ping"]
    interval: 60s
    timeout: 10s
    retries: 3
    start_period: 120s

services:

  # ── Daemon OHLCV condiviso: un solo rate-budget per wallet ──
  srv-ftcache:
    <<: *defaults
    image: freqtrade-ultimate:latest
    container_name: ftcache
    stop_grace_period: 30s
    entrypoint: ["python", "-m", "freqtrade.ohlcv_cache.daemon"]
    command: ["--socket", "/ftcache/ftcache.sock"]
    volumes:
      - ./shared/run:/ftcache:rw
    healthcheck:
      test: ["CMD", "python", "-m", "freqtrade.ohlcv_cache.healthcheck", "--socket", "/ftcache/ftcache.sock"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Daemon pairlist (OPZIONALE) ──
  # srv-ftpairlist:
  #   <<: *defaults
  #   image: freqtrade-ultimate:latest
  #   container_name: ftpairlist
  #   entrypoint: ["python", "-m", "freqtrade.pairlist_cache.daemon"]
  #   command: ["--socket", "/ftcache/ftpairlist.sock"]
  #   volumes:
  #     - ./shared/run:/ftcache:rw
  #   healthcheck:
  #     test: ["CMD", "python", "-m", "freqtrade.ohlcv_cache.healthcheck", "--pairlist", "--socket", "/ftcache/ftpairlist.sock"]
  #     interval: 60s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s

  # ── DEV / RICERCA · runner dedicato · MAI live · prima dei bot ──
  # Config+strategie+codice = /local/sviluppo (versionato). DB/output = dev/user_data (ignorato).
  # Non è un demone: command placeholder esce subito; task via `run --rm`.
  srv-dev:
    image: freqtrade-ultimate:latest
    container_name: dev
    restart: "no"
    healthcheck: { disable: true }
    env_file:
      - .env.shared
      - ./dev/.env                    # NO chiavi live
    depends_on:
      srv-ftcache: { condition: service_healthy }
    volumes:
      - ./dev/user_data:/freqtrade/user_data
      - ./shared/local:/local:rw
      - ./shared/run:/ftcache:rw
      - ./freqtrade-ultimate/user_data/data:/freqtrade/user_data/data
    cpus: 1.0
    mem_limit: 4g
    command: ["--help"]

  # ── BOT 1 · NFI X7 · DRY-RUN (metriche non credibili: lookahead) ──
  srv-bot1:
    <<: *defaults
    image: freqtrade-ultimate:latest
    container_name: bot1
    env_file:
      - .env.shared
      - ./bot1/.env
    depends_on:
      srv-ftcache: { condition: service_healthy }
    volumes:
      - ./bot1/user_data:/freqtrade/user_data
      - ./shared/NostalgiaForInfinity:/nfi-repo:ro
      - ./shared/run:/ftcache:rw
      - ./freqtrade-ultimate/user_data/data:/freqtrade/user_data/data
    ports:
      - "127.0.0.1:8081:8080"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy NostalgiaForInfinityX7

  # ── BOT 2 · RubberBandMeanRev · LIVE ⚠ (mai `compose run` qui) ──
  srv-bot2:
    <<: *defaults
    image: freqtrade-ultimate:latest
    container_name: bot2
    env_file:
      - .env.shared
      - ./bot2/.env
    depends_on:
      srv-ftcache: { condition: service_healthy }
    volumes:
      - ./bot2/user_data:/freqtrade/user_data
      - ./shared/local:/local:ro
      - ./shared/run:/ftcache:rw
      - ./freqtrade-ultimate/user_data/data:/freqtrade/user_data/data
    ports:
      - "127.0.0.1:8082:8080"
    command: >
      trade
      --config /freqtrade/user_data/config.json
      --strategy RubberBandMeanRev6253

  # ── TEMPLATE live futuro (SalientFlush al go-live, DOPO i gate; DB vergine) ──
